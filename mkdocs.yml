site_name: reportnet-client
site_description: Python client for the EEA Reportnet 3 REST API
repo_url: https://github.com/eea/reportnet-client
repo_name: eea/reportnet-client

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            docstring_style: google

nav:
  - Home: index.md
  - How Reportnet is organised: concepts.md
  - Guides:
    - Getting started: guides/getting-started.md
    - What Reportnet expects: guides/schema.md
    - Uploading: guides/import.md
    - Checking your data: guides/validation.md
    - Downloading: guides/export.md
    - When something goes wrong: guides/troubleshooting.md
  - Notebook: notebooks.md
  - For custodians:
    - Admin tasks: guides/custodians.md
    - Reference datasets: guides/reference-datasets.md
  - Changelog: changelog.md
  - API reference:
    - Client: api/client.md
    - Dataflow: api/dataflow-client.md
    - Jobs: api/jobs.md
    - Data types: api/models.md
    - Errors: api/exceptions.md
    - Country codes: api/providers.md
    - Key storage: api/keychain.md
    - Display helpers: api/interactive.md
