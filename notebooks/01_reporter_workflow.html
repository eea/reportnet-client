      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "8a6cd275ec4847862696ff5fe673ae68", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "db6f7c033bf1043666e5c6f41db9c0a4", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"upload-and-validate-a-report\"\u003EUpload and validate a report\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EFive steps, start to finish, as the \u003Cstrong\u003EFrench reporter on dataflow 2003\u003C/strong\u003E\n(\u003Cem\u003EUWWTD \u2014 TESTING \u2014 BIG DATA\u003C/em\u003E):\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003E\u003C/th\u003E\n\u003Cth\u003E\u003C/th\u003E\n\u003Cth\u003E\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E1\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003EConnect\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003Ea reporter key, scoped to France\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E2\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003ELook\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003Ewhich dataset, what tables\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E3\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003ELoad\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003Ethe Toulon data, exactly as it comes off disk\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E4\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003EUpload\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Eimport_frames\u003C/code\u003E reshapes it to the schema\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E5\u003C/td\u003E\n\u003Ctd\u003E\u003Cstrong\u003EValidate\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003Eand read what the server says\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EThe example data is the \u003Cstrong\u003EToulon subset\u003C/strong\u003E \u2014 15 agglomerations and 15\ntreatment plants around Toulon, extracted from France's 2022 submission.\nSmall enough to read, real enough to fail in realistic ways.\u003C/span\u003E\n\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003EReportnet has no release endpoint. This prepares and validates a\nsubmission; a human still presses \u003Cstrong\u003ERelease\u003C/strong\u003E in the web UI.\u003C/span\u003E\n\u003C/blockquote\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "908ea95e3be62392713d55b14e0dfa0f", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "\u003Cfigure style='display: flex; flex-direction: column;'\u003E\u003Cimg src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABfAAAAPACAYAAAB6kFjgAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjAsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvlcelbwAAAAlwSFlzAAAYmwAAGJsBSXWDlAABAABJREFUeJzs3QecnGXV9/Ezfba39IRAQoBQQlG6NBFEFATsoth7eez1we7ro6KooIhdUUGlg4CI9N6kQ4CEBALpyfap98y8n/81O5vdZDfZMrM7O/P74rib2Sn3zNxl7nOd6xyf56VzBgAAAAAAAAAAyop/shcAAAAAAAAAAABsiwA+AAAAAAAAAABliAA+AAAAAAAAAABliAA+AAAAAAAAAABliAA+AAAAAAAAAABliAA+AAAAAAAAAABliAA+AAAAAAAAAABliAA+AAAAAAAAAABliAA+AAAAAAAAAABliAA+AAAAAAAAAABliAA+AAAAAAAAAABliAA+AAAAAAAAAABliAA+AAAAAAAAAABliAB+FTnyyKNsyZIldtFFF032okx5y5Ytc++lLs89t2KyF2dKuOeee/rfs/b2jsleHGDCsL8oP3wm1Y3PH5W2PrJOAwAAVLbgZC8Atu+f//ynfeUrXxnz23T88a+2s8/+sfv9xRdftM2bN1t3d3dFvr6JlEql7IUXVrnfPS894c8/FcXjif73LJvNTPbiVL1cLudO+O+//36777777YEHHrDOzvzAytlnn23HH3/8Dt+jN73pzfb000t3eLvf//73dtBBB1Xte87+ovzwmVT3foHPf3yeeeYZu/XW2+z++++z1atX27p16y0UCtq8eTvZEUccYe94x+nW1tZWpE+r8hVjfWSdBgAAqGwE8Mtcb29v/5f6sdiwYYOVs0p/fagMjzzyiL3zne90v19zzTU2f/58m+pOPfU0u+WWW4b8W29vbESPsXbtmhFtv4lEYtTLB4xFJW6rE4n9wuQr93X4y1/+sv3yl+cP+bcnnnjSrr/+evvRj86yn/zkp/bGN75hwpev0pT7+gAAAICJQQC/zJ100kn26KOPDPm3M8/8ml111VVWW1tr99xz95C3qaurs3JW6a8PlWFgZls67VklSCaTtmjRIjvooAPtwAMPstraGvvoRz82psd63/veZ5/+9KeG/fvMmTPHsaRA8bfV3Xbbrf/YM2fO data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eAPI key\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-placeholder='\u0026quot;paste your France reporter API key\u0026quot;' data-kind='\u0026quot;password\u0026quot;' data-full-width='true' data-disabled='false' data-debounce='true'\u003E\u003C/marimo-text\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "15ee963ae96baffb6d3f1e02937d9a7c", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EPaste a key above to run against the live API. The rest of the notebook explains each step either way.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d7e309e77dada472eb369aa631c298ee", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"your-key-decides-what-you-can-do\"\u003EYour key decides what you can do\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EA Reportnet key carries a \u003Cstrong\u003Erole\u003C/strong\u003E, not just an identity \u2014 and the same\nperson can hold several. A key made as a custodian has no reporter rights\neven if you are also a lead reporter, and regenerating it does not help.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EOne read tells you which you have:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003E\u003C/th\u003E\n\u003Cth\u003Ecustodian key\u003C/th\u003E\n\u003Cth\u003Ereporter key\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003EGET /dataflow/v1/{id}\u003C/code\u003E unscoped\u003C/td\u003E\n\u003Ctd\u003E\u2705 200\u003C/td\u003E\n\u003Ctd\u003E\u274c 403\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Ethe same with \u003Ccode\u003EproviderId\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u274c 403\u003C/td\u003E\n\u003Ctd\u003E\u2705 200\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EThe requirement is \u003Cem\u003Einverted\u003C/em\u003E, so sending \u003Ccode\u003EproviderId\u003C/code\u003E always is not a fix.\n\u003Ccode\u003Efind_reporter()\u003C/code\u003E and \u003Ccode\u003Ecapabilities()\u003C/code\u003E work this out for you; you only need\nto know that \u003Cstrong\u003Euploading report data needs a reporter key\u003C/strong\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "247e5a3f829cab639f03b6a92e40f922", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E(connect above to probe the key's role)\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a957265273e77866c9b40477ef7320be", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"2-which-dataset-am-i-filling-in\"\u003E2. Which dataset am I filling in?\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2c281c6b1b09a2dbaf74f93541d84997", "console": [], "id": "RGSE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E(connect to list your datasets)\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "201d63589832d14c100c5031531d1892", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EWe want \u003Cstrong\u003EDescriptive data\u003C/strong\u003E \u2014 the tabular half (\u003Ccode\u003E108952\u003C/code\u003E for France).\nSpatial data is a separate dataset with its own notebook.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003Eget_schema()\u003C/code\u003E returns the tables and their fields. This is the shape your\nupload has to match.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "85b998404a577cd2b52d184feca2f400", "console": [], "id": "emfo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E(connect to read the schema)\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "1e111fc7bfbfc089636cf23ee2a64a3a", "console": [], "id": "Hstk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"3-load-the-data-as-it-comes-off-disk\"\u003E3. Load the data \u2014 as it comes off disk\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "527cadcaf881510870db1246d67cf03f", "console": [], "id": "nWHF", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E10 tables, 69 rows.\u003C/strong\u003E No cleaning, no renaming, no reordering \u2014 this is the raw extract.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='nWHF-0' random-id='9c466d70-731c-dd85-9d5c-ae7c9d1f7bd3'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;table\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Agglomerations\u0026#92;\u0026quot;,\u0026#92;\u0026quot;rows\u0026#92;\u0026quot;:15,\u0026#92;\u0026quot;columns\u0026#92;\u0026quot;:48},{\u0026#92;\u0026quot;table\u0026#92;\u0026quot;:\u0026#92;\u0026quot;DischargePoints\u0026#92;\u0026quot;,\u0026#92;\u0026quot;rows\u0026#92;\u0026quot;:15,\u0026#92;\u0026quot;columns\u0026#92;\u0026quot;:30},{\u0026#92;\u0026quot;table\u0026#92;\u0026quot;:\u0026#92;\u0026quot;MSLevel\u0026#92;\u0026quot;,\u0026#92;\u0026quot;rows\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;columns\u0026#92;\u0026quot;:21},{\u0026#92;\u0026quot;table\u0026#92;\u0026quot;:\u0026#92;\u0026quot;ReceivingAreasSA54\u0026#92;\u0026quot;,\u0026#92;\u0026quot;rows\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;columns\u0026#92;\u0026quot;:10},{\u0026#92;\u0026quot;table\u0026#92;\u0026quot;:\u0026#92;\u0026quot;ReceivingAreasSAMain\u0026#92;\u0026quot;,\u0026#92;\u0026quot;rows\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;columns\u0026#92;\u0026quot;:20},{\u0026#92;\u0026quot;table\u0026#92;\u0026quot;:\u0026#92;\u0026quot;ReceivingAreasSAParameter\u0026#92;\u0026quot;,\u0026#92;\u0026quot;rows\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;columns\u0026#92;\u0026quot;:12},{\u0026#92;\u0026quot;table\u0026#92;\u0026quot;:\u0026#92;\u0026quot;ReceivingAreasSASA\u0026#92;\u0026quot;,\u0026#92;\u0026quot;rows\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;columns\u0026#92;\u0026quot;:5},{\u0026#92;\u0026quot;table\u0026#92;\u0026quot;:\u0026#92;\u0026quot;ReportPeriod\u0026#92;\u0026quot;,\u0026#92;\u0026quot;rows\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;columns\u0026#92;\u0026quot;:9},{\u0026#92;\u0026quot;table\u0026#92;\u0026quot;:\u0026#92;\u0026quot;UWWTPs\u0026#92;\u0026quot;,\u0026#92;\u0026quot;rows\u0026#92;\u0026quot;:15,\u0026#92;\u0026quot;columns\u0026#92;\u0026quot;:72},{\u0026#92;\u0026quot;table\u0026#92;\u0026quot;:\u0026#92;\u0026quot;UwwtpAgglos\u0026#92;\u0026quot;,\u0026#92;\u0026quot;rows\u0026#92;\u0026quot;:15,\u0026#92;\u0026quot;columns\u0026#92;\u0026quot;:10}]\u0026quot;' data-total-rows='10' data-total-columns='3' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='10' data-field-types='[[\u0026quot;table\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]],[\u0026quot;rows\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;i64\u0026quot;]],[\u0026quot;columns\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;i64\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='true' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "1da656946f2ec137efa469bddc5fc94a", "console": [], "id": "iLit", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"it-does-not-match-the-schema-and-that-is-normal\"\u003EIt does not match the schema, and that is normal\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EReportnet rejects an import whose header is not \u003Cstrong\u003Eexactly\u003C/strong\u003E the table's\nfield list. Not a superset, not a subset \u2014 exactly. Real extracts never\narrive that way:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Ethey carry \u003Cstrong\u003Eextra\u003C/strong\u003E columns from whatever produced them\n  (\u003Ccode\u003EcountryCode\u003C/code\u003E, \u003Ccode\u003EsnapshotId\u003C/code\u003E, \u003Ccode\u003EaggBeginLife_original\u003C/code\u003E)\u003C/li\u003E\n\u003Cli\u003Ethey are \u003Cstrong\u003Emissing\u003C/strong\u003E fields the source never had\u003C/li\u003E\n\u003Cli\u003Edates arrive as timestamps, and a \u003Ccode\u003EDATE\u003C/code\u003E field rejects a time part\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EGet it wrong and the upload returns \u003Cstrong\u003EHTTP 200\u003C/strong\u003E, then the \u003Cem\u003Ejob\u003C/em\u003E fails with\n\u003Cem\u003E\"Import files contain incorrect headers.\"\u003C/em\u003E \u2014 so the request looked fine and\nthe data never landed.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003Eimport_frames\u003C/code\u003E handles all of it. The next cell shows what it will change,\nbefore anything is sent.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c27a9daff505d512921b49f742b83f57", "console": [], "id": "ZHCJ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E(connect to compare the data against the schema)\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9fad03d8b36baa48b7048e9ef6ba6bb7", "console": [], "id": "ROlb", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "3a6934cb0dc1db8db3ff5ea26ae7c403", "console": [], "id": "qnkX", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"4-upload\"\u003E4. Upload\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "044accda0be36f0b5bba9c99f43b80d2", "console": [], "id": "TqIu", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003Ereplace=True\u003C/code\u003E clears each table first, so re-running is safe. Ten tables, uploaded and polled one at a time \u2014 about 3 minutes.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='TqIu-0' random-id='d887e62d-f2e0-e04c-9ed3-367c3625cb48'\u003E\u003Cmarimo-button data-initial-value='0' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eUpload to Reportnet\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;neutral\u0026quot;' data-disabled='false' data-full-width='false'\u003E\u003C/marimo-button\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "be7340e0a4ef030e57b8bb0ccf600247", "console": [], "id": "Vxnm", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E(not run yet)\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f15e3113fc719ae1622df269333c21aa", "console": [], "id": "DnEU", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "810466866bc7828c783ee42063d02f7d", "console": [], "id": "ulZA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"5-validate\"\u003E5. Validate\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EValidation runs the dataflow's quality rules server-side \u2014 433 of them on\nthis dataset. It is slow: \u003Cstrong\u003E10\u201320 minutes\u003C/strong\u003E is normal here, and the client's\ndefault timeout is shorter than that.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIf it times out, \u003Cstrong\u003Edo not submit again.\u003C/strong\u003E Reportnet answers a second\nsubmission with a 423 and an error banner in the reporter's UI. Poll\n\u003Ccode\u003Eget_validation_results()\u003C/code\u003E instead \u2014 it starts nothing.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9f2d1c7743d65d11a943c0726df89137", "console": [], "id": "ecfG", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='ecfG-0' random-id='a70b64fa-9503-037c-565b-6b86ba3976d0'\u003E\u003Cmarimo-button data-initial-value='0' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eValidate\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;neutral\u0026quot;' data-disabled='false' data-full-width='false'\u003E\u003C/marimo-button\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "31cc643b84746b81f4f43925b338236a", "console": [], "id": "Pvdt", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E(not run yet)\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "cfe2f1108c75b58e6d68dbfe2e6bf2dd", "console": [], "id": "ZBYS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "bcec298bd4ba2f337521d6fc33e62e7b", "console": [], "id": "aLJB", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"results-can-be-stale-and-look-exactly-like-fresh-ones\"\u003EResults can be stale, and look exactly like fresh ones\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EThe results endpoint returns \u003Cstrong\u003Eno timestamp and no run id\u003C/strong\u003E, and Reportnet\ndoes not clear it while a new run is going \u2014 it keeps serving the \u003Cem\u003Eprevious\u003C/em\u003E\nrun's numbers. Identical totals from changed data is the whole failure mode:\nthere is nothing in the response to notice.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESo \u003Ccode\u003EValidationResult\u003C/code\u003E carries where the numbers came from:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Ejob\u003C/code\u003E \u2014 the run that produced them\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Esuperseded_by\u003C/code\u003E \u2014 a validation running right now\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Edata_changed_at\u003C/code\u003E \u2014 when the data was last imported\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Eis_stale\u003C/code\u003E \u2014 true if either applies\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ECheck \u003Ccode\u003Eis_stale\u003C/code\u003E before believing a number.\u003C/strong\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "3eeacb9f5783a4cdfddb8a7c0d5e13e0", "console": [], "id": "nHfw", "outputs": [{"ename": "ancestor-stopped", "evalue": "This cell wasn't run because an ancestor was stopped with `mo.stop`: ", "traceback": [], "type": "error"}]}, {"code_hash": "ce1b6281eb91bf3190b322c5fbbf5153", "console": [], "id": "xXTn", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"reading-the-issues\"\u003EReading the issues\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "21b0f08677c25ef174d32fc9f4ff338b", "console": [], "id": "AjVT", "outputs": [{"data": {"text/html": "\u003Cfigure style='display: flex; flex-direction: column;'\u003E\u003Cimg src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABfAAAALgCAYAAADbS1ZiAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjAsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvlcelbwAAAAlwSFlzAAAYmwAAGJsBSXWDlAAA/RNJREFUeJzs3Qd0FFUXwPFLh0DoEHrvTXov0kEREBQ76KdSrCiKoDSld+lNwQ4Wio0OUqT33kHpvYXe8p37wqy7m91kk2ySCfx/nJyE7OzszJuym/vuuy/BnTu3QwQAAAAAAAAAANhKwrjeAAAAAAAAAAAAEBYBfAAAAAAAAAAAbIgAPgAAAAAAAAAANkQAHwAAAAAAAAAAGyKADwAAAAAAAACAD ADAggjwAQAAAAAAAACwIAJ8AAAAAAAAAAAsiAAfAAAAAAAAAAALIsAHAAAAAAAAAMCCCPABAAAAAAAAALAgAnwAAAAAAAAAACyIAB8AAAAAAAAAAAsiwAcAAAAAAAAAwIII8AEAAAAAAAAAsCACfAAAAAAAAAAAxHr+D1CPLn1oSlrHAAAAAElFTkSuQmCC' alt='Bar chart of the eight rules that fired, by severity and records flagged' style='width: 900px' /\u003E\u003Cfigcaption style='color: var(--muted-foreground); text-align: center; margin-top: 0.5rem;'\u003EA representative run: 8 rules fired over 50 records. Severity is ordered BLOCKER \u2192 ERROR \u2192 WARNING; the bar is how many records each rule flagged.\u003C/figcaption\u003E\u003C/figure\u003E"}, "type": "data"}]}, {"code_hash": "463b5ce688e6adb0ecee62c1a670c880", "console": [], "id": "pHFh", "outputs": [{"ename": "ancestor-stopped", "evalue": "This cell wasn't run because an ancestor was stopped with `mo.stop`: ", "traceback": [], "type": "error"}]}, {"code_hash": "b446151112f8eea62c4bdb418238b06f", "console": [], "id": "NCOB", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"what-those-issues-mean-here\"\u003EWhat those issues mean here\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EMost of them are the \u003Cem\u003Esubset\u003C/em\u003E, not a data problem:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u003Ccode\u003ETB461\u003C/code\u003E / \u003Ccode\u003ETB463\u003C/code\u003E Reporter, Contacts\u003C/strong\u003E \u2014 mandatory tables the Toulon\n  extract has no source for, so they are empty.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u003Ccode\u003EReportPeriod-1-repReferenceSystem\u003C/code\u003E\u003C/strong\u003E \u2014 a required field the source\n  does not carry. Alignment added the column; only you can supply a value.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u003Ccode\u003EUWWTPs-31\u003C/code\u003E\u003C/strong\u003E flags all 15 plants although its message says \u003Cem\u003E\"over\n  100 000 p.e.\"\u003C/em\u003E, and only one plant is that big. Its SQL is\n  \u003Ccode\u003EA AND B AND C OR D\u003C/code\u003E with no parentheses, so \u003Ccode\u003EOR D\u003C/code\u003E applies to every row.\n  That is a \u003Cstrong\u003Ebug in the rule\u003C/strong\u003E, not in the data \u2014 worth reporting to the\n  dataflow's custodian rather than trying to fix locally.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EWhich is the real lesson: a failing rule is a question, not a verdict.\u003C/span\u003E\n\u003Ch3 id=\"next\"\u003ENext\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EBLOCKER\u003C/strong\u003E stops a release; \u003Cstrong\u003EERROR\u003C/strong\u003E and \u003Cstrong\u003EWARNING\u003C/strong\u003E do not. Fix what is\nreal, re-upload, re-validate, then press \u003Cstrong\u003ERelease\u003C/strong\u003E in the web UI \u2014 the\nAPI has no endpoint for it.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.9", "script_metadata_hash": null}, "version": "1"},
