name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must stay in sync with requires-python and the classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src tests

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -v

  # The base matrix above installs no extras on purpose: `import reportnet`
  # must work without geopandas/pandas, and only that job proves it. This job
  # covers the other half — the optional-dependency branches in _util.py
  # (geopandas geometry parsing, the pandas fallbacks) which were otherwise
  # skipped in CI entirely.
  test-optional-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies (with spatial extra)
        run: uv sync --extra spatial

      - name: Confirm the optional stack is actually installed
        run: uv run python -c "import geopandas, pandas, shapely; print(geopandas.__version__)"

      - name: Test
        run: uv run pytest -v
