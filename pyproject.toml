[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reportnet-client"
version = "0.5.1"
description = "Python client library for the EEA Reportnet 3 REST API"
readme = "README.md"
requires-python = ">=3.10"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "European Environment Agency" }]
keywords = ["reportnet", "eea", "api-client", "reporting", "environment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/eea/reportnet-client"
Documentation = "https://eea.github.io/reportnet-client/"
Repository = "https://github.com/eea/reportnet-client"
Issues = "https://github.com/eea/reportnet-client/issues"
"Reportnet 3 API" = "https://help.reportnet.europa.eu/rest-api/"

[project.optional-dependencies]
dataframe = ["narwhals>=1.0", "polars>=0.20"]
keyring = ["keyring>=24"]
spatial = ["geopandas>=0.14"]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff",
    "mypy",
    "narwhals>=1.0",
    "polars>=0.20",
    "keyring>=24",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
explore = [
    "marimo>=0.9",
    "polars>=0.20",
    "narwhals>=1.0",
    "matplotlib>=3.7",
    {include-group = "dev"},
]

[tool.hatch.build.targets.wheel]
packages = ["src/reportnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: live API tests (require keyring credentials and network access)"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/reportnet/providers.py" = ["E501"]  # data table — long lines are intentional

[tool.mypy]
strict = true
mypy_path = "src"
